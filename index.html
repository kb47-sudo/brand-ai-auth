<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Authenticator & Market Valuation Report</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --accent-color: #f59e0b;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --unchecked-color: #6b7280;
      --text-color: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--accent-color);
      letter-spacing: 1.5px;
    }
    .header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin: 4px 0 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--accent-color);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .photo-upload-box {
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .photo-upload-box label {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    input[type="file"] { display: none; }

    .btn-select {
      background: #334155;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-block;
    }

    .preview-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .preview-container img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .file-name {
      font-size: 0.75rem;
      color: var(--text-sub);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-clear {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      margin-top: 10px;
    }

    .loading-box {
      text-align: center;
      padding: 24px 16px;
      display: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .progress-bar-bg {
      width: 100%;
      background: #0f172a;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin: 12px 0 8px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      transition: width 0.4s ease;
    }
    .progress-status-text {
      font-size: 0.85rem;
      color: #fff;
      font-weight: bold;
      margin-top: 6px;
    }
    .time-counter-text {
      font-size: 0.8rem;
      color: var(--accent-color);
      margin-top: 6px;
      font-weight: 600;
    }

    .result-card { display: none; }
    
    .model-tag-large {
      background: rgba(245, 158, 11, 0.12);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .model-tag-title {
      font-size: 0.75rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 4px;
    }
    .model-tag-content {
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .score-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
    }
    .score-val {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-color);
    }

    .msg-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #e2
