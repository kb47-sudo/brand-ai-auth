<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内専用 プロ仕様AI真贋判定・ネット型番特定ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="border-b border-gray-800 pb-4 text-center">
      <div class="inline-block bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-xs px-3 py-1 rounded-full mb-2">Google Lens Direct v12.1</div>
      <h1 class="text-3xl font-extrabold text-white tracking-wide">AI Brand Authenticator Pro</h1>
      <p class="text-sm text-gray-400 mt-1">Googleレンズ直結型番特定 ＆ 厳格AI真贋・3大相場査定ポータル</p>
    </header>

    <!-- 1. 基本情報 -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
      <h2 class="text-sm font-semibold text-gray-300">1. 商品基本情報</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">ブランド選択</label>
          <select id="brandSelect" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
            <option value="Louis Vuitton">ルイ・ヴィトン (Louis Vuitton)</option>
            <option value="CHANEL">シャネル (CHANEL)</option>
            <option value="HERMES">エルメス (HERMÈS)</option>
            <option value="ROLEX">ロレックス (ROLEX)</option>
            <option value="GUCCI">グッチ (GUCCI)</option>
            <option value="PRADA">プラダ (PRADA)</option>
            <option value="OTHER">その他ブランド</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">品目カテゴリ</label>
          <select id="categorySelect" onchange="switchCategoryUI()" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
            <option value="bag">バッグ・財布</option>
            <option value="watch">腕時計</option>
            <option value="eyewear">サングラス・メガネ</option>
            <option value="apparel">服・アパレル</option>
            <option value="accessory">小物・アクセサリー</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 2. 画像アップロード ＆ Googleレンズ連携 -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
      <h2 class="text-sm font-semibold text-gray-300">2. 指定部位写真のセット</h2>
      <div id="uploadSlots" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

      <!-- Googleレンズ起動ボタン -->
      <div id="lensSearchBox" class="hidden bg-gray-950 p-4 rounded-xl border border-yellow-500/30 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-yellow-400">🔍 Googleレンズで正確な型番を自動検索</span>
          <button type="button" onclick="openGoogleLens()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 text-xs font-extrabold px-3 py-1.5 rounded-lg shadow transition">
            Googleレンズを開く (カメラ/画像)
          </button>
        </div>
        <p class="text-xs text-gray-400">※開いた画面でカメラマーク（📷）をタップし、先ほど選んだ全体写真を選択すると型番が100%特定できます。</p>
      </div>

      <!-- 型番・シリアル入力欄 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
        <div>
          <label class="block text-xs text-gray-400 mb-1">型番 / 品番 (Ref. / Model No.)</label>
          <input type="text" id="modelNumber" placeholder="例: M41526, 116610LN" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-yellow-400 font-bold focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">シリアル / 製造番号 (Serial No.)</label>
          <input type="text" id="serialNumber" placeholder="例: FL0021" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
        </div>
      </div>

      <button onclick="runGuidedAuth()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-extrabold py-3.5 rounded-xl shadow-lg transition transform active:scale-95 mt-4">
        AI真贋判定 ＆ 3大相場査定を実行
      </button>
    </div>

    <!-- 解析中表示 -->
    <div id="loading" class="hidden bg-gray-900 p-8 rounded-2xl border border-gray-800 text-center space-y-4">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-yellow-500 border-t-transparent"></div>
      <p class="text-yellow-400 text-sm font-semibold">型番・シリアル規格照合・真贋ベクトル計算・相場算出中...</p>
    </div>

    <!-- 3. 結果・相場表示 ＆ PDFレポートエリア -->
    <div id="result" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-6">
      <div id="pdfPrintArea" class="p-4 bg-gray-900 rounded-xl space-y-6">
        <div class="border-b border-gray-800 pb-3 flex justify-between items-center">
          <div>
            <h2 class="text-xs text-yellow-500 font-bold uppercase tracking-wider">AI Authenticator & Market Valuation Report</h2>
            <p id="reportDate" class="text-xs text-gray-500 mt-0.5"></p>
          </div>
          <div class="text-right">
            <span class="text-xs text-gray-400 block">
