<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Authenticator & Market Valuation</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --accent-color: #f59e0b;
      --danger-color: #ef4444;
      --text-color: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      padding: 12px 0;
    }
    .header h1 {
      font-size: 1.2rem;
      margin: 0;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--accent-color);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .photo-upload-box {
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .photo-upload-box label {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    
    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .btn-select {
      background: #334155;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-block;
    }

    .preview-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .preview-container img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .file-name {
      font-size: 0.75rem;
      color: var(--text-sub);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-clear {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      margin-top: 10px;
    }

    .loading-box {
      text-align: center;
      padding: 20px;
      display: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .result-card {
      display: none;
    }
    .status-badge {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 8px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>AI BRAND AUTHENTICATOR</h1>
  </div>

  <div class="card">
    <form id="authForm">
      <div class="form-group">
        <label>対象ブランド</label>
        <select id="brand" required>
          <option value="Louis Vuitton">Louis Vuitton</option>
          <option value="Rolex">Rolex</option>
          <option value="CHANEL">CHANEL</option>
          <option value="HERMES">HERMES</option>
          <option value="GUCCI">GUCCI</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label>カテゴリ</label>
        <select id="category" required>
          <option value="バッグ">バッグ</option>
          <option value="時計">時計</option>
          <option value="財布・小物">財布・小物</option>
          <option value="アパレル・靴">アパレル・靴</option>
        </select>
      </div>

      <div style="margin-top: 16px; margin-bottom: 8px; font-size:0.85rem; font-weight:bold; color:var(--accent-color);">
        部位別撮影（※間違えた写真は個別削除・変更可能）
      </div>

      <!-- ① 全体写真 -->
      <div class="photo-upload-box">
        <label>① 全体写真（表面・裏面）</label>
        <div class="file-input-wrapper">
          <label for="photo1" class="btn-select">ファイルを選択</label>
          <input type="file" id="photo1" accept="image/*" onchange="handleFileSelect(1)">
        </div>
        <div id="preview1" class="preview-container" style="display:none;">
          <img id="img-preview1" src="" alt="縮小表示">
          <span id="name-preview1" class="file-name"></span>
          <button type="button" class="btn-clear" onclick="clearFile(1)">✕ 削除</button>
        </div>
      </div>

      <!-- ② ロゴ刻印 -->
      <div class="photo-upload-box">
        <label>② ブランドロゴ刻印（接写）</label>
        <div class="file-input-wrapper">
          <label for="photo2" class="btn-select">ファイルを選択</label>
          <input type="file" id="photo2" accept="image/*" onchange="handleFileSelect(2)">
        </div>
        <div id="preview2" class="preview-container" style="display:none;">
          <img id="img-preview2" src="" alt="縮小表示">
          <span id="name-preview2" class="file-name"></span>
          <button type="button" class="btn-clear" onclick="clearFile(2)">✕ 削除</button>
        </div>
      </div>

      <!-- ③ シリアル・型番印字 -->
      <div class="photo-upload-box">
        <label>③ シリアル・型番印字</label>
        <div class="file-input-wrapper">
          <label for="photo3" class="btn-select">ファイルを選択</label>
          <input type="file" id="photo3" accept="image/*" onchange="handleFileSelect(3)">
        </div>
        <div id="preview3" class="preview-container" style="display:none;">
          <img id="img-preview3" src="" alt="縮小表示">
          <span id="name-preview3" class="file-name"></span>
          <button type="button" class="btn-clear" onclick="clearFile(3)">✕ 削除</button>
        </div>
      </div>

      <!-- ④ 金具・パーツ -->
      <div class="photo-upload-box">
        <label>④ 金具・ビス・ファスナー</label>
        <div class="file-input-wrapper">
          <label for="photo4" class="btn-select">ファイルを選択</label>
          <input type="file" id="photo4" accept="image/*" onchange="handleFileSelect(4)">
        </div>
        <div id="preview4" class="preview-container" style="display:none;">
          <img id="img-preview4" src="" alt="縮小表示">
          <span id="name-preview4" class="file-name"></span>
          <button type="button" class="btn-clear" onclick="clearFile(4)">✕ 削除</button>
        </div>
      </div>

      <div class="form-group" style="margin-top:12px;">
        <label style="color:var(--text-sub);">手入力補足型番（空欄でAI完全自動判定）</label>
        <input type="text" id="modelNumber" placeholder="例: M61864, 16233G 等">
      </div>

      <button type="submit" class="btn-submit">⚡ AI自動識別 ＆ 3大相場査定を実行</button>
    </form>
  </div>

  <div id="loadingBox" class="card loading-box">
    <div class="spinner"></div>
    <div style="font-size: 0.85rem; color: var(--accent-color);">多重AIエンジンが解析中...<br>型番特定・真贋照合・3大相場を算出しています</div>
  </div>

  <div id="resultCard" class="card result-card">
    <div style="font-size:0.75rem; color:var(--text-sub);" id="resDetectedModel">自動特定型番: --</div>
    <div class="status-badge" id="resJudgment">【 判定中 】</div>
    <div style="font-size:0.85rem; margin-bottom:12px; color:#e2e8f0;" id="resMessage">--</div>

    <div style="font-weight:bold; font-size:0.85rem; color:var(--accent-color); margin-bottom:6px;">推定市場流通相場</div>
    <div class="price-row">
      <span>🏢 買取店相場 (仕入れ目安)</span>
      <span id="resBuyStore" style="font-weight:bold;">-- 円</span>
    </div>
    <div class="price-row">
      <span>📱 フリマ相場 (メルカリ等)</span>
      <span id="resFleamarket" style="font-weight:bold;">-- 円</span>
    </div>
    <div class="price-row">
      <span>🔨 オークション (ヤフオク等)</span>
      <span id="resAuction" style="font-weight:bold;">-- 円</span>
    </div>
  </div>
</div>

<script>
  // 写真選択時の処理＆プレビュー
  function handleFileSelect(index) {
    const input = document.getElementById(`photo${index}`);
    const previewDiv = document.getElementById(`preview${index}`);
    const imgPreview = document.getElementById(`img-preview${index}`);
    const namePreview = document.getElementById(`name-preview${index}`);

    if (input.files && input.files[0]) {
      const file = input.files[0];
      namePreview.textContent = file.name;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        previewDiv.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }
  }

  // 写真の個別削除（クリア）処理
  function clearFile(index) {
    const input = document.getElementById(`photo${index}`);
    const previewDiv = document.getElementById(`preview${index}`);
    const imgPreview = document.getElementById(`img-preview${index}`);
    const namePreview = document.getElementById(`name-preview${index}`);

    input.value = '';
    imgPreview.src = '';
    namePreview.textContent = '';
    previewDiv.style.display = 'none';
  }

  // フォーム送信処理
  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData();
    formData.append('brand', document.getElementById('brand').value);
    formData.append('category', document.getElementById('category').value);
    formData.append('model_number', document.getElementById('modelNumber').value || '');

    let fileCount = 0;
    for (let i = 1; i <= 4; i++) {
      const input = document.getElementById(`photo${i}`);
      if (input.files && input.files[0]) {
        formData.append('files', input.files[0]);
        fileCount++;
      }
    }

    if (fileCount === 0) {
      alert('部位写真を1枚以上アップロードしてください。');
      return;
    }

    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';

    try {
      const response = await fetch('https://brand-ai-backend-1.onrender.com/api/v1/authenticate', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      document.getElementById('resDetectedModel').textContent = `自動特定型番: ${data.detected_model || '判定不能'}`;
      document.getElementById('resJudgment').textContent = `【 ${data.judgment || '結果取得失敗'} 】`;
      document.getElementById('resMessage').textContent = data.message || '';

      if (data.market_prices) {
        document.getElementById('resBuyStore').textContent = data.market_prices.buy_store || '-- 円';
        document.getElementById('resFleamarket').textContent = data.market_prices.fleamarket || '-- 円';
        document.getElementById('resAuction').textContent = data.market_prices.auction || '-- 円';
      }

      document.getElementById('resultCard').style.display = 'block';
    } catch (err) {
      alert(`通信または解析処理でエラーが発生しました。時間を置いて再度お試しください。(${err.message})`);
    } finally {
      document.getElementById('loadingBox').style.display = 'none';
    }
  });
</script>

</body>
</html>
